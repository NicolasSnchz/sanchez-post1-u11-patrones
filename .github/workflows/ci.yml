name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [17, 23]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compilar, probar y medir cobertura
        run: mvn -B -ntp verify
