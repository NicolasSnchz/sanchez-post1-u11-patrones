# Flujo temporal: mide la evidencia de ambas partes y la publica en la rama evidencias.
# Se retira cuando la evidencia queda guardada en docs/.
name: Evidencias

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            23
            17
          cache: maven
      - name: Medir las dos partes
        run: bash .github/evidencias/medir.sh
      - name: Publicar en la rama evidencias
        if: always()
        run: |
          cd evid
          git init -q -b evidencias
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Evidencias de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" evidencias
